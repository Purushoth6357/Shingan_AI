experiment_name: "experiment_005_swinir"
seed: 42

data:
  train_dir: "datasets/train"
  val_dir: "datasets/train"
  test_dir: "datasets/train"
  train_split: "datasets/splits/train.txt"
  val_split: "datasets/splits/val.txt"
  test_split: "datasets/splits/test.txt"
  batch_size: 16
  num_workers: 4
  
  normalization:
    method: "minmax"
    min: -0.0026
    max: 1.3258

model:
  type: "SwinIR"
  in_chans: 1
  img_size: 128
  embed_dim: 48
  depths: [4, 4, 4, 4]
  num_heads: [4, 4, 4, 4]
  window_size: 8
  mlp_ratio: 2.0
  upscale_factor: 2
  upsampler: "pixelshuffle"
  resi_connection: "1conv"

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adamw"
  log_interval: 10
  
  loss:
    type: "hybrid"
    components:
      charbonnier:
        weight: 1.0
      sobel:
        weight: 0.1
      focal_frequency:
        weight: 0.1
  
  early_stopping:
    enabled: false
    patience: 10
    
validation:
  every_n_epochs: 1

tracking:
  experiment_name: "experiment_005_swinir"
  save_dir: "experiments"
  
evaluation:
  metrics: ["psnr", "ssim", "gmc", "lpips"]
  device: "cuda"
