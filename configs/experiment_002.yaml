experiment_name: "experiment_002_sobel"
seed: 42

data:
  train_dir: "/content/drive/MyDrive/Shingan_AI/train"
  val_dir: "/content/drive/MyDrive/Shingan_AI/train"
  test_dir: "/content/drive/MyDrive/Shingan_AI/train"
  batch_size: 16
  num_workers: 4
  
  normalization:
    method: "minmax"
    min: -0.0026
    max: 1.3258

model:
  architecture: "cnn"
  in_channels: 1
  out_channels: 1
  features: 64
  upscale_factor: 2

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adamw"
  log_interval: 10
  
  loss:
    type: "hybrid"
    components:
      charbonnier:
        weight: 1.0
      sobel:
        weight: 0.1
  
  early_stopping:
    enabled: false
    patience: 10
    
validation:
  every_n_epochs: 1

tracking:
  experiment_name: "experiment_002_sobel"
  save_dir: "experiments"
  
evaluation:
  metrics: ["psnr", "ssim"]
  device: "cuda"
