experiment_name: "experiment_004_hybrid"
seed: 42

data:
  train_dir: "datasets/train"
  val_dir: "datasets/train"
  test_dir: "datasets/train"
  train_split: "datasets/splits/train.txt"
  val_split: "datasets/splits/val.txt"
  test_split: "datasets/splits/test.txt"
  batch_size: 16
  num_workers: 4
  
  normalization:
    method: "minmax"
    min: -0.0026
    max: 1.3258

model:
  type: "HybridCNNTransformer"
  in_channels: 1
  out_channels: 1
  embed_dim: 64
  num_cnn_blocks: 6
  num_transformer_blocks: 2
  num_heads: 4
  ffn_expansion_factor: 2.66
  upscale_factor: 2

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adamw"
  log_interval: 10
  
  loss:
    type: "hybrid"
    components:
      charbonnier:
        weight: 1.0
      sobel:
        weight: 0.1
      focal_frequency:
        weight: 0.1
  
  early_stopping:
    enabled: false
    patience: 10
    
validation:
  every_n_epochs: 1

tracking:
  experiment_name: "experiment_004_hybrid"
  save_dir: "experiments"
  
evaluation:
  metrics: ["psnr", "ssim", "gmc", "lpips"]
  device: "cuda"
