experiment_name: "baseline_cnn_v1"
seed: 42

data:
  train_dir: "datasets/train"
  val_dir: "datasets/test"
  test_dir: "datasets/test"
  batch_size: 16
  num_workers: 4
  
  normalization:
    method: "minmax" # Options: none, minmax, zscore
    min: -0.0026
    max: 1.3258

model:
  architecture: "cnn" # Options: cnn, hybrid
  in_channels: 1
  out_channels: 1
  features: 64
  upscale_factor: 2

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adamw" # Options: adam, adamw
  log_interval: 10
  
  early_stopping:
    enabled: false
    patience: 10
    
validation:
  every_n_epochs: 1

tracking:
  experiment_name: "experiment_001"
  save_dir: "experiments"
  
evaluation:
  metrics: ["psnr", "ssim"]
  device: "cuda"
